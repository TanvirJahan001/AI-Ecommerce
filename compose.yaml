name: ecommerce-local

services:
  db:
    # PostgreSQL component of the official self-hosted Supabase stack.
    # The app uses pg + Better Auth; no Supabase HTTP services are needed locally.
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:docker first}
      POSTGRES_DB: postgres
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      JWT_EXP: "3600"
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_statement=none",
        "-c",
        "pgaudit.log=none",
      ]
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "postgres",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  database:
  database-config:
